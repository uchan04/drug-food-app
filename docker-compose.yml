version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: drug-food-checker-db
    environment:
      POSTGRES_DB: drug_food_checker
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d drug_food_checker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
