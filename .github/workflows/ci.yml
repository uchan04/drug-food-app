name: CI

on:
  push:
  pull_request:

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "8"

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: drug_food_checker_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://test:test_password@localhost:5432/drug_food_checker_test?schema=public&connection_limit=5"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter api prisma generate

      - name: Run migrations
        run: pnpm --filter api prisma migrate deploy

      - name: Seed test data
        run: pnpm --filter api prisma db seed

      - name: Lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Run PBT tests
        run: pnpm test:pbt

      - name: Build API
        run: pnpm --filter @drug-food-checker/api build

      - name: Smoke test - boot API and hit /api/health
        env:
          JWT_SECRET: ci-smoke-only-not-a-real-secret
        run: |
          pnpm --filter @drug-food-checker/api start:prod &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/api/health; then
              echo "API booted"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to boot within 30s"
          exit 1

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter api prisma generate

      - name: Build all packages
        run: pnpm build
